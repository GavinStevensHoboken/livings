# Local production-like stack: `docker compose up --build`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: livings
      POSTGRES_USER: livings
      POSTGRES_PASSWORD: livings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livings"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/livings
      DATABASE_USERNAME: livings
      DATABASE_PASSWORD: livings
      # Generate your own: openssl rand -base64 48
      LIVINGS_JWT_SECRET: ${LIVINGS_JWT_SECRET:-Y2hhbmdlLW1lLWJlZm9yZS1kZXBsb3lpbmctdGhpcy1pcy1ub3Qtc2VjcmV0LTAxMjM0NTY3ODk=}
      LIVINGS_SWAGGER_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
