spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/livings}
    username: ${DATABASE_USERNAME:livings}
    password: ${DATABASE_PASSWORD:livings}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    enabled: ${LIVINGS_SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${LIVINGS_SWAGGER_ENABLED:false}
