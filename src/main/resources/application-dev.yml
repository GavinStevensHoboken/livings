# Local development: file-based H2 in PostgreSQL compatibility mode, no external services needed.
spring:
  datasource:
    url: jdbc:h2:file:./data/livings;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
